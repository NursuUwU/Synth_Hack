name: Repository startup

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-startup:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and HTTP tests
        run: python -m unittest discover -s tests
      - name: Start from bundled data and analyze every case
        run: python scripts/smoke_clean_checkout.py
      - name: Reproduce frozen external pilot offline
        run: python scripts/validate_external.py --bundled --output outputs/ci-external --expect validation/results/external-v1.json
