[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genomic-detective"
version = "0.1.0"
description = "Evidence-based educational variant prioritization workflow"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
genomic-detective = "genomic_detective.cli:main"

[tool.setuptools.packages.find]
include = ["genomic_detective*"]

[tool.setuptools.package-data]
genomic_detective = ["static/*"]
